name: Offline contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src run.py benchlib.py
      - run: python run.py rag --output .runs/validation --validate-only
      - run: python scripts/public_audit.py
